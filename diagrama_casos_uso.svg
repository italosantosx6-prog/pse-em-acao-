<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>

  <!-- Boundary -->
  <rect x="150" y="30" width="560" height="500" rx="10" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="430" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">Sistema PSE em Ação</text>

  <!-- Actor -->
  <g>
    <circle cx="60" cy="130" r="14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="60" y1="144" x2="60" y2="190" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="30" y1="160" x2="90" y2="160" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="60" y1="190" x2="35" y2="225" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="60" y1="190" x2="85" y2="225" stroke="#1a1a1a" stroke-width="2"/>
    <text x="60" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Operador</text>
    <text x="60" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">do Sistema</text>
  </g>

  <!-- Use cases (ellipses) -->
  <g>
    <ellipse cx="430" cy="100" rx="150" ry="32" fill="#eaf2fb" stroke="#2b5d8c" stroke-width="2"/>
    <text x="430" y="105" text-anchor="middle" font-size="14" fill="#15324a">Cadastrar Ação</text>
  </g>

  <g>
    <ellipse cx="430" cy="180" rx="150" ry="32" fill="#eaf2fb" stroke="#2b5d8c" stroke-width="2"/>
    <text x="430" y="185" text-anchor="middle" font-size="14" fill="#15324a">Listar Ações</text>
  </g>

  <g>
    <ellipse cx="430" cy="260" rx="150" ry="32" fill="#eaf2fb" stroke="#2b5d8c" stroke-width="2"/>
    <text x="430" y="265" text-anchor="middle" font-size="14" fill="#15324a">Pesquisar Ação</text>
  </g>

  <g>
    <ellipse cx="430" cy="340" rx="150" ry="32" fill="#eaf2fb" stroke="#2b5d8c" stroke-width="2"/>
    <text x="430" y="345" text-anchor="middle" font-size="14" fill="#15324a">Atualizar Situação</text>
  </g>

  <g>
    <ellipse cx="430" cy="420" rx="150" ry="32" fill="#eaf2fb" stroke="#2b5d8c" stroke-width="2"/>
    <text x="430" y="425" text-anchor="middle" font-size="14" fill="#15324a">Gerar Resumo Geral</text>
  </g>

  <g>
    <ellipse cx="430" cy="490" rx="150" ry="28" fill="#f3eaea" stroke="#8c2b2b" stroke-width="2"/>
    <text x="430" y="495" text-anchor="middle" font-size="13" fill="#4a1515">Encerrar Sistema</text>
  </g>

  <!-- Lines from actor to each use case -->
  <line x1="92" y1="135" x2="280" y2="100" stroke="#555555" stroke-width="1.4"/>
  <line x1="92" y1="150" x2="280" y2="180" stroke="#555555" stroke-width="1.4"/>
  <line x1="92" y1="170" x2="280" y2="260" stroke="#555555" stroke-width="1.4"/>
  <line x1="92" y1="195" x2="280" y2="340" stroke="#555555" stroke-width="1.4"/>
  <line x1="92" y1="215" x2="280" y2="420" stroke="#555555" stroke-width="1.4"/>
  <line x1="92" y1="230" x2="280" y2="490" stroke="#555555" stroke-width="1.4"/>

  <!-- include relationship: Atualizar Situacao includes registrar qtd efetiva -->
  <line x1="430" y1="372" x2="430" y2="400" stroke="#777777" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <ellipse cx="620" cy="340" rx="110" ry="26" fill="#f6f1e3" stroke="#8c6d1f" stroke-width="1.6"/>
  <text x="620" y="345" text-anchor="middle" font-size="11.5" fill="#4a3a10">Registrar Qtd. Efetiva</text>
  <line x1="490" y1="340" x2="512" y2="340" stroke="#777777" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="560" y="325" text-anchor="middle" font-size="10" fill="#555555" font-style="italic">«include»</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#777777"/>
    </marker>
  </defs>
</svg>
